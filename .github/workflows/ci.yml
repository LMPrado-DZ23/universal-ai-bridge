name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:source
      - run: npm run build
      - run: npm run typecheck
      - run: npm test -- --reporter=default --reporter=json --outputFile=validation-artifacts/tests.json
      - run: npm audit --omit=dev
      - run: npm audit --audit-level=moderate
      - run: node scripts/smoke-doctor.mjs
      - name: Windows installer script checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-installer.ps1
      - name: Windows PowerShell 5.1 installer checks
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test-installer.ps1
      - name: Generate dependency inventory
        run: npm sbom --sbom-format cyclonedx --omit=dev > sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: validation-${{ matrix.os }}
          path: |
            validation-artifacts/*
            sbom.cdx.json
          if-no-files-found: warn
