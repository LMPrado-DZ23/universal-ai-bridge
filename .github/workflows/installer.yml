name: Build Windows Installer

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "installer/**"
      - "src/**"
      - "package.json"
      - ".github/workflows/installer.yml"
  workflow_dispatch:

# Padrão restritivo; só o job de release ganha contents:write.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      CODE_SIGN_PFX_BASE64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}
      CODE_SIGN_PASSWORD: ${{ secrets.CODE_SIGN_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps, build, test
        run: |
          npm ci
          npm run build
          npm test
        shell: pwsh

      - name: Gerar SBOM (CycloneDX, só produção)
        run: npm sbom --sbom-format cyclonedx --omit=dev > sbom.cdx.json
        shell: pwsh

      - name: Prune to production dependencies
        run: npm prune --omit=dev
        shell: pwsh

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
        shell: pwsh

      - name: Compile installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\UniversalAI-Bridge.iss"
          if (-not (Test-Path "installer\Output\UniversalAI-Bridge-Setup.exe")) { throw "Instalador não foi gerado." }
        shell: pwsh

      - name: Sign installer (se houver certificado)
        if: env.CODE_SIGN_PFX_BASE64 != ''
        run: '& "installer\scripts\sign.ps1" -File "installer\Output\UniversalAI-Bridge-Setup.exe" -PfxBase64 "$env:CODE_SIGN_PFX_BASE64" -Password "$env:CODE_SIGN_PASSWORD"'
        shell: pwsh

      - name: Empacotar assets + checksums
        run: |
          New-Item -ItemType Directory -Force dist-release | Out-Null
          Copy-Item "installer\Output\UniversalAI-Bridge-Setup.exe" dist-release\
          Copy-Item "sbom.cdx.json" dist-release\
          $h = (Get-FileHash "dist-release\UniversalAI-Bridge-Setup.exe" -Algorithm SHA256).Hash.ToLower()
          "$h  UniversalAI-Bridge-Setup.exe" | Out-File "dist-release\SHA256SUMS.txt" -Encoding ascii
          Get-Content "dist-release\SHA256SUMS.txt"
        shell: pwsh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: dist-release/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # só aqui, e só em tags v*
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist-release
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist-release/*
